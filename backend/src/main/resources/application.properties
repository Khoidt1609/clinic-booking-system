spring.application.name=booking

# Cấu hình kết nối MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/clinic_booking_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Hibernate JPA tự động tạo bảng từ code Java
spring.jpa.hibernate.ddl-auto=update
# Hiển thị câu lệnh SQL dưới Console để dễ debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cấu hình jwt
jwt.secret=ClinicBookingSecretKeyForJWTAuthenticationSystemDangKhoi
jwt.expiration-ms=86400000