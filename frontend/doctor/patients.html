<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Fonts & CSS -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/doctor.css">
    <link rel="stylesheet" href="/assets/css/component.css">
</head>

<body>
    <div class="doctor-layout">
        <div id="sidebarContainer"></div>
        <!-- NỘI DUNG CHÍNH (MASTER - DETAIL) -->
        <main class="main-content bg-light p-4">

            <div class="master-detail-container">
                <!-- Danh sách bệnh nhân -->
                <div class="master-list">
                    <div class="p-3 border-bottom bg-white z-1">
                        <h5 class="fw-bold mb-3">Tra cứu bệnh nhân</h5>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted border-end-0"><i
                                    class="bi bi-search"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" id="searchPatient"
                                placeholder="Tìm tên hoặc SĐT..." onkeyup="filterPatients()">
                        </div>
                    </div>

                    <div class="patient-list-container" id="patientList">
                        <!-- JS sẽ render danh sách bệnh nhân vào đây -->
                        <div class="text-center py-5 text-muted">
                            <div class="spinner-border spinner-border-sm text-primary mb-2" role="status"></div>
                            <p class="small">Đang tải danh sách...</p>
                        </div>
                    </div>
                </div>

                <!-- Chi tiết hồ sơ -->
                <div class="detail-view">
                    <!-- Trạng thái trống khi chưa chọn ai -->
                    <div id="emptyDetailState"
                        class="h-100 d-flex flex-column align-items-center justify-content-center text-muted">
                        <i class="bi bi-person-vcard fs-1 mb-3 opacity-50"></i>
                        <h5>Chưa chọn bệnh nhân</h5>
                        <p class="small">Vui lòng chọn một bệnh nhân từ danh sách bên trái để xem hồ sơ.</p>
                    </div>

                    <!-- Khung chi tiết (Ẩn đi lúc đầu) -->
                    <div id="patientDetailContent" class="d-none p-4 p-lg-5">

                        <!-- Khối 1: Thông tin hành chính & Y tế cơ bản -->
                        <div class="d-flex align-items-start gap-4 mb-4 pb-4 border-bottom">

                            <div class="w-100">

                                <div class="row g-3 bg-white p-3 rounded-3 border shadow-sm small">
                                    <h4 class="fw-bold mb-1 text-dark" id="detailName">Tên Bệnh Nhân</h4>

                                    <div class="col-md-4">
                                        <span class="text-muted d-block mb-1">Ngày sinh</span>
                                        <strong id="detailDob">---</strong>
                                    </div>
                                    <div class="col-md-4">
                                        <span class="text-muted d-block mb-1">Giới tính</span>
                                        <strong id="detailGender">---</strong>
                                    </div>
                                    <div class="col-md-4">
                                        <span class="text-muted d-block mb-1">Nhóm máu</span>
                                        <strong id="detailBlood" class="text-danger">---</strong>
                                    </div>
                                    <div class="col-md-4">
                                        <span class="text-muted d-block mb-1">Số điện thoại</span>
                                        <strong id="detailPhone">---</strong>
                                    </div>
                                    <div class="col-md-8">
                                        <span class="text-muted d-block mb-1">Địa chỉ</span>
                                        <strong id="detailAddress">---</strong>
                                    </div>
                                    <div class="col-12 d-flex border-top pt-2 mt-2">
                                        <span class="text-muted fw-bold d-block  me-2 ">Dị
                                            ứng:</span>
                                        <div id="detailAllergies" class="text-dark">---</div>

                                    </div>
                                    <div class="col-12 d-flex  mt-2">
                                        <span class="text-muted fw-bold d-block mb-1 me-2">Tiền
                                            sử bệnh:</span>
                                        <div id="detailMedicalHistory" class="text-dark">---</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Lịch sử khám (Timeline) -->
                        <h5 class="fw-bold mb-4 text-dark"><i class="bi bi-clock-history text-secondary me-2"></i>Lịch
                            sử
                            khám bệnh</h5>

                        <div class="timeline" id="medicalHistoryTimeline">

                        </div>
                    </div>

                </div>
            </div>

        </main>
    </div>

    <!-- Modal xem lại chi tiết đơn thuốc (Có thể dùng chung modal với trang Khám bệnh) -->
    <div class="modal fade" id="recordDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header bg-light border-bottom-0">
                    <h5 class="modal-title fw-bold">Chi tiết Bệnh án</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4" id="recordDetailModalBody">
                    <!-- Nội dung đổ từ JS -->
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/component.js"></script>
    <script src="/assets/js/doctor-patient.js"></script>
    <script src="/assets/js/main.js"></script>

</body>

</html>
