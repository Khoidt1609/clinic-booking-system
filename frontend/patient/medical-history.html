<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng khám Đa Khoa - Đặt lịch khám bệnh</title>

    <!-- Nhúng Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Nhúng Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/home.css">
    <link rel="stylesheet" href="/assets/css/component.css">
    <link rel="shortcut icon" href="/assets/images/clinic-hero.jpg" type="image/x-icon">

</head>

<body>
    <div id="mainNavbar"></div>

    <div class="page-container">
        <h4 class="fw-bold mb-1">Lịch sử khám bệnh</h4>
        <p class="text-muted mb-4">Xem lại chẩn đoán và đơn thuốc của các lần khám trước</p>


        <div id="loadingIndicator" class="text-center py-5">
            <div class="spinner-border text-cyan" role="status"></div>
            <p class="mt-2 text-muted">Đang tải lịch sử...</p>
        </div>

        <div id="emptyState" class="text-center py-5 d-none bg-white rounded-3 border">
            <i class="bi bi-clock-history fs-1 text-muted mb-3 d-block"></i>
            <h5 class="fw-bold">Chưa có lịch sử khám bệnh</h5>
            <p class="text-muted">Bạn chưa hoàn thành hoặc hủy lịch khám nào tại hệ thống của chúng tôi.</p>
        </div>
        <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>
        <div id="historyContainer" class=" d-none"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/medical-history.js"></script>
    <script src="/assets/js/main.js"></script>
</body>

</html>
