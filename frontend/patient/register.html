<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Phòng khám Đa khoa</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
        rel="stylesheet">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link href="/assets/css/variables.css" rel="stylesheet">
    <link href="/assets/css/layout.css" rel="stylesheet">

    <link href="/assets/css/auth.css" rel="stylesheet">
    <link href="/assets/css/component.css" rel="stylesheet">
</head>

<body>
    <!--    NAVBAR     -->
    <div id="mainNavbar"></div>

    <div class="auth-page py-5">
        <!-- Nới rộng thẻ card ra một chút (max-width: 500px) để form đăng ký đỡ bị chật -->
        <div class="app-card auth-card" style="max-width: 500px;">
            <div class="text-center mb-4">
                <div class="brand fs-4">Phòng khám Đa khoa</div>
                <p class="text-muted mb-0 mt-1">Tạo tài khoản bệnh nhân mới</p>
            </div>

            <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>
            <div id="successBox" class="alert alert-success d-none" role="alert"></div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="mb-3">
                    <label for="fullName" class="form-label fw-medium">Họ và tên</label>
                    <input type="text" class="form-control" id="fullName" placeholder="Ví dụ: Nguyễn Văn A" required>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label fw-medium">Số điện thoại</label>
                    <input type="tel" class="form-control" id="phone" placeholder="09xxxxxxxxx" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-medium">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Ví dụ: nguyenvana@gmail.com"
                        required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-medium">Mật khẩu</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" placeholder="Tạo mật khẩu" required>
                        <button
                            class="btn btn-link text-secondary toggle-password position-absolute end-0 top-50 translate-middle-y me-1 rounded-circle d-flex align-items-center justify-content-center"
                            type="button" data-target="password"
                            style="width: 38px; height: 38px; z-index: 5; text-decoration: none;">
                            <i class="bi bi-eye fs-5"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="confirmPassword" class="form-label fw-medium">Xác nhận mật khẩu</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu"
                            required>
                        <button
                            class="btn btn-link text-secondary toggle-password position-absolute end-0 top-50 translate-middle-y me-1 rounded-circle d-flex align-items-center justify-content-center"
                            type="button" data-target="confirmPassword"
                            style="width: 38px; height: 38px; z-index: 5; text-decoration: none;">
                            <i class="bi bi-eye fs-5"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fs-6">Đăng ký tài khoản</button>
            </form>

            <p class="text-center text-muted mt-4 mb-0">
                Đã có tài khoản? <a href="login.html" class="text-decoration-none fw-semibold"
                    style="color: var(--color-primary);">Đăng nhập ngay</a>
            </p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- Scripts -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/main.js"></script>


</body>

</html>
