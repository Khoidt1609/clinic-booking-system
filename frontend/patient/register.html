    <link href="/assets/css/component.css" rel="stylesheet">

<body>
  <!--    NAVBAR     -->

                </div>
                Phòng khám Nhẫn Tâm

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="bi bi-list fs-1 text-secondary"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 fw-medium">
                     <li class="nav-item"><a class="nav-link px-3" href="/index.html#about">Giới thiệu</a></li>

                </ul>
                 <div class="d-flex w-sm-100 w-lg-auto  gap-2" id="authNavArea">
                    <a href="/patient/login.html" class="btn btn-light fw-medium text-dark border flex-fill w-lg-auto">Đăng nhập</a>

<div class="auth-page py-5">
    <!-- Nới rộng thẻ card ra một chút (max-width: 500px) để form đăng ký đỡ bị chật -->
    <div class="app-card auth-card" style="max-width: 500px;">
        <div class="text-center mb-4">
            <div class="brand fs-4">Phòng khám Đa khoa</div>
            <p class="text-muted mb-0 mt-1">Tạo tài khoản bệnh nhân mới</p>
        </div>

        <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>
        <div id="successBox" class="alert alert-success d-none" role="alert"></div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="mb-3">
                <label for="fullName" class="form-label fw-medium">Họ và tên</label>
                <input type="text" class="form-control" id="fullName" placeholder="Ví dụ: Nguyễn Văn A" required>
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label fw-medium">Số điện thoại</label>
                <input type="tel" class="form-control" id="phone" placeholder="09xxxxxxxxx" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label fw-medium">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Ví dụ: nguyenvana@gmail.com" required>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label fw-medium">Mật khẩu</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" placeholder="Tạo mật khẩu" required>
                     <button class="btn btn-link text-secondary toggle-password position-absolute end-0 top-50 translate-middle-y me-1 rounded-circle d-flex align-items-center justify-content-center" type="button" data-target="password" 
                    style="width: 38px; height: 38px; z-index: 5; text-decoration: none;">
                      <i class="bi bi-eye fs-5"></i>
                    </button>
                </div>
            </div>

            <div class="mb-4">
                <label for="confirmPassword" class="form-label fw-medium">Xác nhận mật khẩu</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                     <button class="btn btn-link text-secondary toggle-password position-absolute end-0 top-50 translate-middle-y me-1 rounded-circle d-flex align-items-center justify-content-center" type="button" data-target="confirmPassword" 
                    style="width: 38px; height: 38px; z-index: 5; text-decoration: none;">
                      <i class="bi bi-eye fs-5"></i>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 py-2 fs-6">Đăng ký tài khoản</button>
        </form>

        <p class="text-center text-muted mt-4 mb-0">
            Đã có tài khoản? <a href="login.html" class="text-decoration-none fw-semibold" style="color: var(--color-primary);">Đăng nhập ngay</a>
        </p>
    </div>
</div>
