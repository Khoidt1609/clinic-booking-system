<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng khám Đa Khoa - Đặt lịch khám bệnh</title>

    <!-- Nhúng Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Nhúng Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/home.css">
    <link rel="stylesheet" href="/assets/css/component.css">
    <link rel="shortcut icon" href="/assets/images/clinic-hero.jpg" type="image/x-icon">
</head>

<body>

    <div id="mainNavbar"></div>

    <div class="page-container">
        <div class="d-flex justify-content-between align-items-end mb-4">
            <div>
                <h4 class="fw-bold my-1">Lịch hẹn của tôi</h4>
                <p class="text-muted my-0">Danh sách các lịch khám đã đặt</p>
            </div>
            <a href="/patient/booking.html" class="btn btn-primary ">Đặt lịch mới <i class="bi bi-plus-lg ms-1"></i></a>
        </div>

        <div id="loadingIndicator" class="text-center py-5">
            <div class="spinner-border text-cyan" role="status"></div>
            <p class="mt-2 text-muted">Đang tải lịch hẹn...</p>
        </div>

        <div id="appointmentsContainer"></div>

        <div id="emptyState" class="text-center py-5 d-none  text-muted bg-white rounded-3 border">
            <div class="mb-3">
                <i class="bi bi-calendar-x text-secondary" style="font-size: 4rem; opacity: 0.5;"></i>
            </div>
            <p class="mb-2">Bạn chưa có lịch hẹn nào.</p>
            <a href="/patient/booking.html" class="btn btn-primary">Đặt lịch khám ngay</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/appointments.js"></script>


    <script src="/assets/js/main.js"></script>
</body>

</html>
