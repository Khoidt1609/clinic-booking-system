<!DOCTYPE html>

    <!-- Nhúng Bootstrap 5 -->

    <link rel="stylesheet" href="/assets/css/variables.css">

            <div class="collapse navbar-collapse" id="navbarNav">

                </ul>
                <div class="d-flex w-sm-100 w-lg-auto  gap-2" id="authNavArea">
                    <a href="/patient/login.html"
